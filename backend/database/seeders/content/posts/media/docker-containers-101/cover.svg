<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Original cover art for "Docker & Containers 101" (CyberCompass): boxes of stacked layers on one kernel slab. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a4a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="#0b1220"/>
  <rect width="1600" height="640" fill="url(#grid)" opacity="0.6"/>

  <!-- Kernel slab -->
  <rect x="160" y="500" width="1280" height="56" rx="12" fill="#14b8a6"/>
  <text x="800" y="537" font-size="26" font-weight="700" fill="#04201d" text-anchor="middle" letter-spacing="2">LINUX KERNEL</text>

  <!-- Four containers, each a stack of layers with a writable top -->
  <g stroke="#0b1220" stroke-width="3">
    <g transform="translate(220 180)">
      <rect width="220" height="300" rx="14" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 9"/>
      <rect x="20" y="40" width="180" height="44" rx="8" fill="#f59e0b"/>
      <rect x="20" y="96" width="180" height="44" rx="8" fill="#38bdf8"/>
      <rect x="20" y="152" width="180" height="44" rx="8" fill="#0ea5e9"/>
      <rect x="20" y="208" width="180" height="72" rx="8" fill="#0369a1"/>
    </g>
    <g transform="translate(520 120)">
      <rect width="220" height="360" rx="14" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 9"/>
      <rect x="20" y="40" width="180" height="44" rx="8" fill="#f59e0b"/>
      <rect x="20" y="96" width="180" height="104" rx="8" fill="#22c55e"/>
      <rect x="20" y="212" width="180" height="128" rx="8" fill="#0369a1"/>
    </g>
    <g transform="translate(820 200)">
      <rect width="220" height="280" rx="14" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 9"/>
      <rect x="20" y="40" width="180" height="44" rx="8" fill="#f59e0b"/>
      <rect x="20" y="96" width="180" height="44" rx="8" fill="#38bdf8"/>
      <rect x="20" y="152" width="180" height="108" rx="8" fill="#0369a1"/>
    </g>
    <g transform="translate(1120 150)">
      <rect width="220" height="330" rx="14" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 9"/>
      <rect x="20" y="40" width="180" height="44" rx="8" fill="#f59e0b"/>
      <rect x="20" y="96" width="180" height="44" rx="8" fill="#38bdf8"/>
      <rect x="20" y="152" width="180" height="44" rx="8" fill="#0ea5e9"/>
      <rect x="20" y="208" width="180" height="102" rx="8" fill="#0369a1"/>
    </g>
  </g>
  <text x="160" y="84" font-size="44" font-weight="700" fill="#f8fafc">Containers 101</text>
  <text x="160" y="124" font-size="24" fill="#94a3b8">processes, fences and layers</text>
</svg>
