<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Original illustration for "Docker & Containers 101" (CyberCompass). One host kernel, three containers. -->
  <rect width="1600" height="900" fill="#f4f6f9"/>
  <text x="80" y="88" font-size="40" font-weight="700" fill="#0f172a">Three containers, one kernel</text>
  <text x="80" y="134" font-size="24" fill="#475569">Each container is ordinary processes, fenced off by the kernel and given its own layered filesystem.</text>

  <!-- Containers -->
  <g>
    <!-- Container 1 -->
    <rect x="90" y="190" width="430" height="440" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="120" y="236" font-size="26" font-weight="700" fill="#0e7490">web</text>
    <text x="120" y="268" font-size="20" fill="#475569">PID 1 inside: gunicorn</text>
    <rect x="120" y="292" width="370" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="140" y="329" font-size="21" fill="#92400e">Writable layer (lost on docker rm)</text>
    <rect x="120" y="362" width="370" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="140" y="395" font-size="20" fill="#0c4a6e">COPY app.py</text>
    <rect x="120" y="420" width="370" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="140" y="453" font-size="20" fill="#0c4a6e">/venv with Flask, gunicorn</text>
    <rect x="120" y="478" width="370" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="140" y="511" font-size="20" fill="#0c4a6e">python:3.13-slim (Debian)</text>
    <text x="120" y="566" font-size="19" fill="#475569">Read-only image layers, shared</text>
    <text x="120" y="592" font-size="19" fill="#475569">by every container of the image</text>

    <!-- Container 2 -->
    <rect x="585" y="190" width="430" height="440" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="615" y="236" font-size="26" font-weight="700" fill="#0e7490">db</text>
    <text x="615" y="268" font-size="20" fill="#475569">PID 1 inside: postgres</text>
    <rect x="615" y="292" width="370" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="635" y="329" font-size="21" fill="#92400e">Writable layer</text>
    <rect x="615" y="362" width="370" height="108" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="635" y="398" font-size="20" fill="#14532d">Volume db-data mounted at</text>
    <text x="635" y="426" font-size="20" fill="#14532d">/var/lib/postgresql/data</text>
    <text x="635" y="454" font-size="18" fill="#14532d">(outlives the container)</text>
    <rect x="615" y="478" width="370" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="635" y="511" font-size="20" fill="#0c4a6e">postgres:17-alpine</text>

    <!-- Container 3 -->
    <rect x="1080" y="190" width="430" height="440" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="1110" y="236" font-size="26" font-weight="700" fill="#0e7490">proxy</text>
    <text x="1110" y="268" font-size="20" fill="#475569">PID 1 inside: nginx</text>
    <rect x="1110" y="292" width="370" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1130" y="329" font-size="21" fill="#92400e">Writable layer</text>
    <rect x="1110" y="362" width="370" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="1130" y="395" font-size="20" fill="#0c4a6e">nginx.conf</text>
    <rect x="1110" y="420" width="370" height="108" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="1130" y="463" font-size="20" fill="#0c4a6e">nginx:1.29-alpine</text>
    <text x="1130" y="491" font-size="18" fill="#0c4a6e">(its own layers)</text>
  </g>

  <!-- Fences: the kernel features that make the boxes -->
  <g font-size="20" fill="#0f172a">
    <rect x="90" y="660" width="1420" height="64" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="114" y="700" font-weight="700">Fences</text>
    <text x="214" y="700">namespaces: what it can see</text>
    <text x="540" y="700">cgroups: how much it can use</text>
    <text x="870" y="700">capabilities + seccomp: what root may do</text>
    <text x="1290" y="700">overlayfs: its root</text>
  </g>

  <!-- Kernel -->
  <rect x="90" y="744" width="1420" height="96" rx="14" fill="#1e293b"/>
  <text x="800" y="790" font-size="30" font-weight="700" fill="#f8fafc" text-anchor="middle">One Linux kernel, shared by every container</text>
  <text x="800" y="822" font-size="20" fill="#cbd5e1" text-anchor="middle">No guest operating system: a container cannot run a different kernel than its host</text>
</svg>
