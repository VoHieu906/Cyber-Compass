<!doctype html>
<!--
  Sandboxed 3D block host (docs/SANDBOXED_3D.md). Only ever loaded inside
  <iframe sandbox="allow-scripts">; the HTTP CSP for /sandbox/* keeps it off the network.
  frame.js is generated by `npm run sandbox:build` (scripts/build-sandbox.mjs).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="frame.css" />
    <script src="frame.js" defer></script>
  </head>
  <body></body>
</html>
