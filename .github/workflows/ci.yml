# Continuous integration (ARCHITECTURE D46). Runs on every pull request and every push to main.
# The backend and the end-to-end suite run in the same Docker images as local development
# (docker-compose.yml: PHP 8.5, MySQL 8.4 with its separate test database), so CI tests the
# environment the project is built on. GitHub-hosted runners are free for this public repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: http://localhost:8000

jobs:
  backend:
    name: Backend (Pint, Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the stack
        run: ./.github/scripts/prepare-stack.sh
      - name: Start MySQL and the API
        run: ./.github/scripts/start-stack.sh mysql api
      - name: Code style (Pint)
        run: docker compose exec -T api ./vendor/bin/pint --test
      - name: Tests (Pest on MySQL)
        run: docker compose exec -T api php artisan test
      - name: API logs on failure
        if: failure()
        run: docker compose logs api mysql --tail=200

  frontend:
    name: Frontend (tsc, ESLint, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare the stack
        run: ./.github/scripts/prepare-stack.sh
      - name: Start MySQL, Mailpit and the API; migrate and seed the content
        run: ./.github/scripts/start-stack.sh --seed mysql mailpit api
      - name: Start the queue worker (notifications are queued)
        run: docker compose up -d --wait worker
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the suite (builds and starts the app)
        working-directory: frontend
        env:
          # Playwright's bundled Chromium instead of Edge (D45).
          E2E_CHANNEL: ""
          # A production build: enforce the page weight and API budgets (performance.spec.ts).
          E2E_PERF: "1"
        run: npm run e2e
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose logs api worker --tail=200
