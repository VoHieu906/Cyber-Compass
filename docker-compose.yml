# Local development environment.
#   docker compose up -d         start everything
#   docker compose exec api php artisan migrate --seed
# Production runs the same images (target: production) on AWS ECS; see docs/ARCHITECTURE.md §8.

name: cybercompass

x-api-common: &api-common
  build:
    context: ./backend
    target: development
  image: cybercompass-api:dev
  # Laravel reads backend/.env from the mounted source; only container-specific values are set here.
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - ./backend:/var/www/html
    # Dependencies stay on the Linux side of Docker Desktop: reading thousands of vendor files
    # through the Windows bind mount made every request take seconds.
    - api-vendor:/var/www/html/vendor
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cybercompass}
      MYSQL_USER: ${DB_USERNAME:-cybercompass}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env (copy .env.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the root .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

  api:
    <<: *api-common
    ports:
      - "${FORWARD_API_PORT:-8000}:8080"

  worker:
    <<: *api-common
    # One job per process, and a fresh process after 60 idle seconds: Docker restarts it with the
    # current code, so backend edits apply without queue:restart. queue:listen would do that too,
    # but it runs jobs with --once, where Laravel never arms a job's own timeout (the content
    # package jobs' 900 s, D70). Production keeps a long-running queue:work: deploys replace tasks.
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--sleep=3", "--max-jobs=1", "--max-time=60"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  # Runs scheduled tasks (hourly learning reminders, D34). On AWS the same command runs as a
  # second container in the worker task (D38, docs/ARCHITECTURE.md §8).
  scheduler:
    <<: *api-common
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    restart: unless-stopped
    healthcheck:
      disable: true

  # Opt-in: `docker compose --profile web up`. For day-to-day frontend work run `npm run dev`
  # in frontend/ on the host instead: Docker Desktop's file sharing on Windows/macOS delays or
  # drops file events, so hot reload in this container is unreliable (docs/ARCHITECTURE.md D13).
  web:
    profiles: ["web"]
    build:
      context: ./frontend
      target: development
    image: cybercompass-web:dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server Components reach the API over the compose network, not through the host port.
      INTERNAL_API_URL: http://api:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "${FORWARD_WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    depends_on:
      - api

volumes:
  api-vendor:
  mysql-data:
  web-node-modules:
  web-next:
